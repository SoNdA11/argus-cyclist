<div id="eventHubPage" class="home-overlay hidden ev-hub" style="z-index: 10000;"
    aria-label="Modo evento: lista de largada">

    <div class="ev-hub-top">
        <div class="ev-tagline">
            <span class="ev-tag ev-tag--accent">ARGUS CYCLIST</span>
            <span class="ev-tag ev-tag--dark">DESAFIO DO LITORAL</span>
        </div>
        <div class="ev-hub-top-right">
            <div class="ev-equip" id="eventEquip" data-state="off">
                <div class="ev-equip-status">
                    <span class="ev-equip-dot" aria-hidden="true"></span>
                    <span class="ev-equip-text">
                        <span class="ev-equip-kicker">Equipamento</span>
                        <span id="eventTrainerStatus" class="status-indicator" role="status">Desconectado</span>
                    </span>
                </div>
                <div class="ev-equip-actions">
                    <select id="eventTrainerList" class="hidden" aria-label="Rolos encontrados"></select>
                    <button id="btnEventScanTrainer" class="ev-equip-btn" type="button"
                        title="Procurar rolo por Bluetooth"></button>
                    <button id="btnEventConnectTrainer" class="ev-equip-btn hidden" type="button"
                        title="Conectar o rolo escolhido"></button>
                    <button id="btnEventConnectVirtual" class="ev-equip-btn" type="button"
                        title="Usar o simulador de potência"></button>
                    <button id="btnEventDisconnectTrainer" class="ev-equip-btn hidden" type="button"
                        title="Desconectar"></button>
                </div>
            </div>
            <button class="ev-icon-btn" id="btnCloseEventHub" type="button" title="Sair do modo evento"
                aria-label="Sair do modo evento">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="ev-hub-main">
        <div class="ev-hub-head">
            <h1>LISTA DE LARGADA</h1>
            <span>ESCOLHA O DESAFIO · ↑ ↓ E ENTER</span>
        </div>

        <div class="ev-panel ev-startlist" role="radiogroup" aria-label="Desafios">
            <div class="ev-startlist-cols ev-label" aria-hidden="true">
                <span>#</span><span>Prova</span><span class="ev-start-profile">Percurso</span><span>Recorde</span>
            </div>

            <button class="ev-start-row" id="btnLaunchSprint" data-mode="sprint200" type="button" role="radio"
                aria-checked="true">
                <span class="ev-start-badge">1</span>
                <span class="ev-start-name">
                    <strong>SPRINT 200 M</strong>
                    <span>Plano, tudo ou nada. Vence o menor tempo.</span>
                </span>
                <span class="ev-start-profile" aria-hidden="true">
                    <svg width="130" height="38" viewBox="0 0 130 38">
                        <path d="M2 28 H128 V36 H2 Z" fill="rgba(25, 236, 214,0.18)"></path>
                        <path d="M2 28 H128" stroke="#19ecd6" stroke-width="3" fill="none"></path>
                    </svg>
                </span>
                <span class="ev-start-record" data-role="record"><strong>—</strong><span>Sem recorde ainda</span></span>
            </button>

            <button class="ev-start-row" id="btnLaunchKOM" data-mode="climb400" type="button" role="radio"
                aria-checked="false">
                <span class="ev-start-badge">2</span>
                <span class="ev-start-name">
                    <strong>SUBIDA 400 M</strong>
                    <span>Ladeira de 3% a 6%. O rolo endurece e o seu peso conta.</span>
                </span>
                <span class="ev-start-profile" aria-hidden="true">
                    <svg width="130" height="38" viewBox="0 0 130 38">
                        <path d="M2 34 L30 30 L60 22 L95 12 L128 3 V36 H2 Z" fill="rgba(25, 236, 214,0.18)"></path>
                        <path d="M2 34 L30 30 L60 22 L95 12 L128 3" stroke="#19ecd6" stroke-width="3" fill="none">
                        </path>
                    </svg>
                </span>
                <span class="ev-start-record" data-role="record"><strong>—</strong><span>Sem recorde ainda</span></span>
            </button>

            <button class="ev-start-row" id="btnLaunchTimeTrial" data-mode="timeTrial" type="button" role="radio"
                aria-checked="false">
                <span class="ev-start-badge">3</span>
                <span class="ev-start-name">
                    <strong>DESAFIO DE ZONAS 60 S</strong>
                    <span>Um minuto para somar pontos nas zonas mais altas.</span>
                </span>
                <span class="ev-start-profile" aria-hidden="true">
                    <svg width="130" height="38" viewBox="0 0 130 38">
                        <rect x="2" y="28" width="18" height="8" fill="#9aa4b2"></rect>
                        <rect x="24" y="24" width="18" height="12" fill="#4f9dff"></rect>
                        <rect x="46" y="20" width="18" height="16" fill="#3fd08a"></rect>
                        <rect x="68" y="14" width="18" height="22" fill="#ffd23d"></rect>
                        <rect x="90" y="8" width="18" height="28" fill="#ff8c3a"></rect>
                        <rect x="112" y="2" width="16" height="34" fill="#ff4d5e"></rect>
                    </svg>
                </span>
                <span class="ev-start-record" data-role="record"><strong>—</strong><span>Sem recorde ainda</span></span>
            </button>
        </div>

        <div class="ev-hub-bottom">
            <div class="ev-panel ev-athlete">
                <span class="ev-label">Atleta</span>
                <div class="ev-athlete-fields">
                    <label class="ev-field">Nome
                        <input type="text" id="eventRiderName" placeholder="Digite seu nome" maxlength="24"
                            autocomplete="off">
                    </label>
                    <label class="ev-field">Categoria
                        <select id="eventRiderGender">
                            <option value="F">Feminino</option>
                            <option value="M">Masculino</option>
                            <option value="G" selected>Não informar</option>
                        </select>
                    </label>
                    <label class="ev-field">Peso (kg)
                        <input type="number" id="eventRiderWeight" placeholder="kg" min="35" max="150" step="1"
                            inputmode="numeric">
                    </label>
                </div>
                <div class="ev-hub-message" id="eventHubMessage" role="alert"></div>
            </div>
            <button class="ev-cta" id="btnEventStart" type="button">
                <strong>LARGAR</strong>
                <span data-role="label">SPRINT 200 M</span>
            </button>
        </div>
    </div>

    <div class="ev-hub-footer">
        <div class="ev-hub-footer-actions">
            <button id="btnEventLeaderboard" class="ev-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"></path>
                    <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path>
                </svg>
                Ranking
            </button>
            <button id="btnRaceHistory" class="ev-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="12 8 12 12 14 14"></polyline>
                    <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
                </svg>
                Histórico
            </button>
            <button id="btnFairMode" class="ev-btn ev-btn--muted" type="button"
                title="Trava do operador: desliga o simulador para que todo resultado venha de um rolo real">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span data-role="label">Modo Feira: desligado</span>
            </button>
            <button id="btnGraphicsQuality" class="ev-btn ev-btn--muted" type="button"
                title="Resolução da cena 3D (Baixo para computadores modestos)">
                <span data-role="label">Gráficos: Alto</span>
            </button>
        </div>
        <div class="ev-hub-tip" id="eventHubTip">O ghost do recorde larga ao seu lado. Bata o tempo dele até a chegada.
        </div>
    </div>
</div>
