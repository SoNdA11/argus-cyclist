<!-- Trophy Room: weekly streak, custom goals and achievements (UIManager.loadTrophyRoom). -->
<div id="trophyModal" class="modal-overlay ar-modal-page hidden">
    <div class="settings-content trophy-modal-content">
        <div class="ar-page-top">
            <div class="ar-tagline">
                <span class="ar-tag">TROPHY ROOM</span>
                <span class="ar-tag-dark">AWARDS &amp; STATS</span>
            </div>
            <button class="ar-icon-btn" id="btnCloseTrophy" type="button" title="Close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>

        <div class="trophy-layout">
            <div class="trophy-main-grid">
                <section class="ar-panel trophy-card streak-card" aria-label="Weekly streak">
                    <span class="ar-label">Weekly streak</span>
                    <div class="streak-value" id="streakCount">0</div>
                    <span class="streak-label">weeks in a row with at least one ride</span>
                </section>

                <section class="ar-panel trophy-card goals-card" aria-label="Custom goals">
                    <div class="ar-panel-head">
                        <span>CUSTOM GOALS</span>
                        <button class="ar-btn btn-add-goal-premium" onclick="window.ui.openCustomGoalModal()">+ New goal</button>
                    </div>
                    <div id="customGoalsList" class="compact-goals-list">
                        <div class="ar-empty">Loading goals...</div>
                    </div>
                    <div class="completed-section">
                        <span class="ar-label">Completed</span>
                        <div id="completedGoalsList" class="tiny-goals-list"></div>
                    </div>
                </section>
            </div>

            <section class="badges-section" aria-label="Achievements">
                <h2 class="ar-h2">ACHIEVEMENTS</h2>
                <div class="badges-scroll-container">
                    <div id="badgesContainer" class="badges-minimal-grid">
                        <div class="ar-empty">Loading badges...</div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
