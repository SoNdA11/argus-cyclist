<!-- Heart-rate recovery after the ride (main.js updates the timer and the current HR). -->
<div id="cooldownModal" class="modal-overlay ar-dialog-overlay">
    <section class="ar-dialog is-bad is-center" role="dialog" aria-labelledby="cooldownTitle">
        <span class="ar-label ar-dialog-kicker">End of ride</span>
        <h2 class="ar-h2" id="cooldownTitle">HEART RATE RECOVERY</h2>
        <p class="ar-body">Stop pedaling or spin lightly. We are measuring how fast your heart slows down.</p>
        <span class="ar-dialog-clock" id="cooldownTimer">02:00</span>
        <div class="ar-dialog-metrics">
            <div><span class="ar-label">Now</span><span class="ar-dialog-val is-hr" id="cooldownHR">-- bpm</span></div>
        </div>
        <button id="btnSkipCooldown" class="ar-btn ar-dialog-full" type="button">Skip and save</button>
    </section>
</div>
