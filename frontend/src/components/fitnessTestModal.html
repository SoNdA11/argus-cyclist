<!-- Assessments: list of physiological tests (rows built in main.js). -->
<div id="fitnessTestModal" class="modal-overlay ar-modal-page hidden">
    <div class="settings-content ar-assess">
        <div class="ar-page-top">
            <div class="ar-tagline">
                <span class="ar-tag">ASSESSMENTS</span>
                <span class="ar-tag-dark" id="arAssessFtp">YOUR TRAINING ZONES</span>
            </div>
            <button class="close-btn ar-icon-btn" type="button" aria-label="Close"
                onclick="document.getElementById('fitnessTestModal').classList.remove('active'); document.getElementById('fitnessTestModal').classList.add('hidden')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div class="ar-assess-head">
            <h1 class="ar-h1">CHOOSE THE TEST</h1>
            <span class="ar-caption">Sets your FTP and training zones</span>
        </div>
        <div id="fitnessTestList" class="ar-panel ar-assess-list"></div>
    </div>
</div>
