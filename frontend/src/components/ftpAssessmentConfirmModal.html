<!-- Confirms the FTP an assessment is scaled from (main.js fills the message and the button). -->
<div id="ftpAssessmentConfirmModal" class="modal-overlay ar-dialog-overlay hidden">
    <section class="ar-dialog is-accent" role="dialog" aria-labelledby="ftpConfirmTitle">
        <div class="ar-dialog-head">
            <span class="ar-label ar-dialog-kicker">Assessment</span>
            <button class="close-btn ar-icon-btn" type="button" onclick="window.closeAssessmentFTPConfirmModal()" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <h2 class="ar-h2" id="ftpConfirmTitle">CONFIRM BASELINE FTP</h2>
        <p id="ftpAssessmentConfirmMessage" class="ar-body"></p>
        <div class="ar-dialog-actions">
            <button id="btnEditAssessmentFTP" class="ar-btn" type="button">Edit FTP</button>
            <button id="btnProceedAssessmentFTP" class="ar-btn-primary" type="button">PROCEED</button>
        </div>
    </section>
</div>
