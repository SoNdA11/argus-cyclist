<!-- Unfinished session found on start-up (main.js fills recoveryDetails). -->
<div id="recoveryModal" class="modal-overlay ar-dialog-overlay">
    <section class="ar-dialog is-info" role="dialog" aria-labelledby="recoveryTitle">
        <span class="ar-label ar-dialog-kicker">On start-up</span>
        <h2 class="ar-h2" id="recoveryTitle">UNFINISHED SESSION</h2>
        <p id="recoveryDetails" class="ar-body">An unfinished session was found and can still be saved.</p>
        <div class="ar-dialog-actions">
            <button id="btnDiscardRecovery" class="ar-btn-danger" type="button">Discard</button>
            <button id="btnRecoverSession" class="ar-btn-primary" type="button">RECOVER &amp; SAVE</button>
        </div>
    </section>
</div>
