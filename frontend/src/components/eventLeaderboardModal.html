<!-- Event ranking: one tower per challenge, filtered by category. Towers are rendered by
     ChallengeController.renderLeaderboardModal(). -->
<div id="eventLeaderboardModal" class="ev-screen ev-ranking hidden" aria-label="Ranking do evento">
    <div class="ev-screen-shade ev-screen-shade--deep" aria-hidden="true"></div>

    <div class="ev-screen-top">
        <div class="ev-tagline">
            <span class="ev-tag ev-tag--accent">RANKING</span>
            <span class="ev-tag ev-tag--dark">DESAFIO DO LITORAL</span>
        </div>
        <div class="ev-ranking-tools">
            <div class="ev-pills" role="group" aria-label="Categoria">
                <button class="lb-filter-btn" type="button" data-filter="G" aria-pressed="true">Geral</button>
                <button class="lb-filter-btn" type="button" data-filter="F" aria-pressed="false">Feminino</button>
                <button class="lb-filter-btn" type="button" data-filter="M" aria-pressed="false">Masculino</button>
            </div>
            <label class="ev-check" title="Mostrar tentativas feitas no simulador (fora do ranking oficial)">
                <input type="checkbox" id="lbIncludeSimulated">
                Incluir simulador
            </label>
            <button class="ev-btn" id="btnCloseEventLeaderboard" type="button">← Lista de largada</button>
        </div>
    </div>

    <div id="eventLeaderboardPanels" class="ev-ranking-grid"></div>
</div>
